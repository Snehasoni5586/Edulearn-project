<h1>Lists, Tuples and Dictionaries</h1>

<h2>List</h2>
<pre>
numbers = [1, 2, 3]
print(numbers)
</pre>

<h2>Tuple</h2>
<pre>
fruits = ("Apple", "Mango")
print(fruits)
</pre>

<h2>Dictionary</h2>
<pre>
student = {"name": "Sneha", "age": 20}
print(student)
</pre>
