<h1>Classes and Objects</h1>

<h2>Class</h2>
<p>A class is a blueprint for creating objects.</p>

<h2>Example</h2>

<pre>
class Student:
    name = "Sneha"

s = Student()
print(s.name)
</pre>

<h2>Output</h2>

<pre>
Sneha
</pre>
