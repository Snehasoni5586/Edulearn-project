<h1>Inheritance in Python</h1>

<p>
Inheritance allows one class to use the properties of another class.
</p>

<h2>Example</h2>

<pre>
class Parent:
    name = "Sneha"

class Child(Parent):
    pass

obj = Child()
print(obj.name)
</pre>

<h2>Output</h2>

<pre>
Sneha
</pre>
